[project]
name = "synthetic-insurance-ai-architecture"
version = "0.1.0"
description = "Synthetic enterprise AI architecture prototype"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
packages = ["insure_ai"]
